name: Build slides

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro)
        run: npm run build

      - name: Verify dataset generator
        run: |
          cd datos/scripts
          python3 generar_dataset_sintetico.py --salida ../salida_ci
