name: Build slides

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro)
        run: npm run build

      - name: Verify classroom interactions
        run: node --test tests/interacciones.test.mjs

      - name: Verify Day 1 timing and distributed dataset
        run: python3 scripts/verificar_dia1.py

      - name: Verify Day 2 relationships, controls and timing
        run: python3 scripts/verificar_dia2.py

      - name: Verify Days 3 to 5 curriculum and downloads
        run: node scripts/verificar_curso.mjs

      - name: Verify detailed activities and raw datasets
        run: python3 scripts/verificar_practicas.py

      - name: Verify indicator references and Day 5 verifier
        run: |
          python3 scripts/controles_dia3.py
          python3 tests/verificador_dia5_test.py

      - name: Verify dataset generator
        run: |
          cd datos/scripts
          python3 generar_dataset_sintetico.py --salida ../salida_ci
